name: Build Carrom Arena APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create google-services.json securely
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Gradle wrapper configuration
        run: |
          mkdir -p android/gradle/wrapper

          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
          EOF

      - name: Upgrade Android build tools
        run: |
          echo "Updating Android Gradle Plugin..."
          sed -i \
            -e 's/id("com\.android\.application") version "8\.9\.1"/id("com.android.application") version "8.11.1"/g' \
            -e 's/id("com\.android\.application") version "8\.11\.1"/id("com.android.application") version "8.11.1"/g' \
            -e 's/id("org\.jetbrains\.kotlin\.android") version "2\.1\.0"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' \
            -e 's/id("org\.jetbrains\.kotlin\.android") version "2\.2\.[0-9]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' \
            android/settings.gradle.kts

          cat android/settings.gradle.kts

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Carrom-Arena-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
